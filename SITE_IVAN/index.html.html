<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Альбомы Ваньки ееееее</title>
    <style>
        /* --- CSS Переменные и Базовые стили --- */
        :root {
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --accent-color: #ff0033;
            --glass-border: rgba(255, 255, 255, 0.12);
            --transition-speed: 0.6s;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            position: fixed;
            width: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color var(--transition-speed) ease;
            touch-action: manipulation;
            padding: calc(var(--safe-top)) calc(var(--safe-right)) calc(var(--safe-bottom)) calc(var(--safe-left));
        }

        /* ========================================================= */
        /* ==================  ФОН: СВЕТ И СВЕЧЕНИЕ  =============== */
        /* ========================================================= */

        /* --- Фоновая сетка --- */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 1;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        }

        /* --- Виньетка --- */
        body::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* --- Контейнер для всех световых пятен --- */
        .light-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* --- Основное центральное свечение (реагирует на альбом) --- */
        .bg-glow {
            position: absolute;
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, var(--accent-color) 0%, transparent 65%);
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: background 1s ease;
            animation: pulseGlow 8s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.25; }
            100% { transform: translate(-50%, -50%) scale(1.25); opacity: 0.45; }
        }

        /* --- Аврора-блобы (движущиеся цветные пятна) --- */
        .aurora {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.55;
            mix-blend-mode: screen;
            will-change: transform;
        }

        .aurora-1 {
            width: 550px; height: 550px;
            background: radial-gradient(circle, #ff0033 0%, transparent 70%);
            top: -10%; left: -10%;
            animation: floatA 22s infinite ease-in-out;
        }

        .aurora-2 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, #00bfff 0%, transparent 70%);
            bottom: -15%; right: -10%;
            animation: floatB 26s infinite ease-in-out;
        }

        .aurora-3 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, #8a2be2 0%, transparent 70%);
            top: 30%; right: 10%;
            animation: floatC 30s infinite ease-in-out;
        }

        .aurora-4 {
            width: 450px; height: 450px;
            background: radial-gradient(circle, #00ff88 0%, transparent 70%);
            bottom: 10%; left: 5%;
            animation: floatD 24s infinite ease-in-out;
        }

        @keyframes floatA {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(180px, 120px) scale(1.15); }
            66% { transform: translate(80px, 220px) scale(0.9); }
        }

        @keyframes floatB {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-200px, -150px) scale(1.2); }
        }

        @keyframes floatC {
            0%, 100% { transform: translate(0, 0) scale(1); }
            40% { transform: translate(-150px, 200px) scale(1.1); }
            70% { transform: translate(-250px, 50px) scale(0.85); }
        }

        @keyframes floatD {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(220px, -180px) scale(1.15); }
        }

        /* --- Звёзды / частицы --- */
        .stars {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6) 50%, transparent 50%),
                radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.4) 50%, transparent 50%),
                radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.5) 50%, transparent 50%),
                radial-gradient(1.5px 1.5px at 35% 80%, rgba(255,255,255,0.5) 50%, transparent 50%),
                radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.3) 50%, transparent 50%),
                radial-gradient(1px 1px at 90% 55%, rgba(255,255,255,0.4) 50%, transparent 50%),
                radial-gradient(1.5px 1.5px at 50% 15%, rgba(255,255,255,0.4) 50%, transparent 50%),
                radial-gradient(1px 1px at 75% 85%, rgba(255,255,255,0.35) 50%, transparent 50%);
            animation: twinkle 6s infinite alternate ease-in-out;
            opacity: 0.7;
        }

        @keyframes twinkle {
            0% { opacity: 0.4; }
            100% { opacity: 0.9; }
        }

        /* ========================================================= */
        /* ================  ОСНОВНОЙ КОНТЕЙНЕР  =================== */
        /* ========================================================= */

        .app-container {
            position: relative;
            z-index: 3;
            display: flex;
            width: 92%;
            max-width: 1200px;
            height: 85vh;
            height: 85dvh;

            /* --- Стеклянный эффект --- */
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.08) 0%,
                rgba(255, 255, 255, 0.02) 50%,
                rgba(255, 255, 255, 0.06) 100%
            );
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);

            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;

            /* Многослойные тени и блики */
            box-shadow: 
                0 25px 60px -10px rgba(0, 0, 0, 0.7),
                0 0 60px rgba(255, 255, 255, 0.03),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 0 rgba(0, 0, 0, 0.2),
                inset 0 0 80px rgba(255, 255, 255, 0.02);

            transition: box-shadow var(--transition-speed) ease, border-color var(--transition-speed) ease;
        }

        /* Блик сверху контейнера */
        .app-container::before {
            content: '';
            position: absolute;
            top: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            z-index: 10;
            pointer-events: none;
        }

        /* ========================================================= */
        /* ================  ЛЕВАЯ СЕКЦИЯ (Обложки) ================ */
        /* ========================================================= */

        .covers-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            position: relative;
            border-right: 1px solid var(--glass-border);
            perspective: 1000px;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.03) 0%,
                rgba(255, 255, 255, 0.01) 100%
            );
        }

        /* Вертикальный световой блик на разделителе */
        .covers-section::after {
            content: '';
            position: absolute;
            top: 10%; bottom: 10%; right: -1px;
            width: 1px;
            background: linear-gradient(180deg, transparent, rgba(255,255,255,0.2), transparent);
            pointer-events: none;
        }

        .cover-wrapper {
            position: relative;
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.7),
                0 0 0 1px rgba(255, 255, 255, 0.1),
                0 0 40px rgba(var(--accent-color-rgb, 255, 0, 51), 0.15);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow var(--transition-speed) ease;
            transform-style: preserve-3d;
        }

        /* Стеклянный блик на обложке */
        .cover-wrapper::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.2) 0%,
                transparent 30%,
                transparent 70%,
                rgba(255, 255, 255, 0.08) 100%
            );
            pointer-events: none;
            z-index: 2;
            border-radius: 16px;
        }

        .cover-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity var(--transition-speed) ease, transform var(--transition-speed) ease;
            transform: scale(1.1);
            filter: contrast(1.1) saturate(1.15);
            -webkit-user-drag: none;
            user-select: none;
            pointer-events: none;
        }

        .cover-wrapper img.active {
            opacity: 1;
            transform: scale(1);
        }

        /* ========================================================= */
        /* ====================  ИНДИКАТОРЫ  ======================= */
        /* ========================================================= */

        .indicators {
            display: flex;
            gap: 10px;
            margin-top: 35px;
            align-items: center;
            padding: 8px 14px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .indicator {
            width: 32px;
            height: 4px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .indicator::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 0%; height: 100%;
            background: var(--accent-color);
            transition: width 0.4s ease;
            border-radius: 3px;
            box-shadow: 0 0 10px var(--accent-color);
        }

        .indicator.active::after {
            width: 100%;
            box-shadow: 0 0 15px var(--accent-color), 0 0 25px var(--accent-color);
        }

        /* ========================================================= */
        /* ============  ПРАВАЯ СЕКЦИЯ (Цветной сегмент) =========== */
        /* ========================================================= */

        .text-section {
            flex: 1.2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .text-content {
            position: absolute;
            top: 50%;
            left: 40px;
            right: 40px;
            transform: translateY(-50%) translateX(30px);
            opacity: 0;
            pointer-events: none;
            transition: all var(--transition-speed) cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 2;
            border-radius: 18px;
            padding: 40px;
            overflow: hidden;

            /* Стеклянный эффект с цветом альбома */
            background: linear-gradient(
                135deg,
                color-mix(in srgb, var(--card-color, var(--accent-color)) 45%, transparent) 0%,
                color-mix(in srgb, var(--card-color, var(--accent-color)) 20%, transparent) 100%
            );
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);

            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 25px 60px -10px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                0 0 60px color-mix(in srgb, var(--card-color, var(--accent-color)) 30%, transparent),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* Темный оверлей для читаемости текста на цветном фоне */
        .text-content::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                135deg,
                rgba(0, 0, 0, 0.85) 0%,
                rgba(0, 0, 0, 0.55) 50%,
                rgba(0, 0, 0, 0.75) 100%
            );
            z-index: -1;
            border-radius: 18px;
        }

        /* Стеклянный блик сверху карточки */
        .text-content::after {
            content: '';
            position: absolute;
            top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
            pointer-events: none;
        }

        .text-content.active {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
            pointer-events: auto;
        }

        .album-title {
            font-size: 2.6rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 10px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.6), 0 0 40px var(--accent-color);
            position: relative;
            display: inline-block;
            word-break: break-word;
        }

        .album-title.active {
            animation: glitch 0.4s cubic-bezier(.25,.46,.45,.94) both;
        }

        @keyframes glitch {
            0% { transform: translate(0); text-shadow: 0 2px 20px rgba(0,0,0,0.6), 0 0 40px var(--accent-color); }
            20% { transform: translate(-3px, 2px); text-shadow: -3px 0 #fff, 3px 0 #00ffff; }
            40% { transform: translate(-3px, -2px); text-shadow: 3px 0 #fff, -3px 0 #00ffff; }
            60% { transform: translate(3px, 2px); text-shadow: -3px 0 #fff, 3px 0 #00ffff; }
            80% { transform: translate(3px, -2px); text-shadow: 3px 0 #fff, -3px 0 #00ffff; }
            100% { transform: translate(0); text-shadow: 0 2px 20px rgba(0,0,0,0.6), 0 0 40px var(--accent-color); }
        }

        .album-artist {
            font-size: 1rem;
            color: #fff;
            font-weight: 700;
            margin-bottom: 25px;
            letter-spacing: 6px;
            text-transform: uppercase;
            opacity: 0.95;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        .album-desc {
            font-size: 1rem;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 35px;
            border-left: 3px solid rgba(255,255,255,0.4);
            padding-left: 20px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .album-meta {
            display: flex;
            gap: 25px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .album-meta span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .album-meta span::before {
            content: '//';
            color: #fff;
            font-weight: bold;
            opacity: 0.9;
        }

        /* ========================================================= */
        /* ====================  АДАПТИВНОСТЬ  ===================== */
        /* ========================================================= */

        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
                height: 92dvh;
                width: 95%;
                border-radius: 16px;
            }

            .covers-section {
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
                padding: 25px 20px 15px;
                flex: 0 0 auto;
            }

            .covers-section::after {
                top: auto; bottom: -1px; left: 10%; right: 10%;
                width: auto; height: 1px;
                background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            }

            .cover-wrapper {
                max-width: 200px;
            }

            .indicators {
                margin-top: 20px;
                gap: 8px;
                padding: 6px 10px;
            }

            .indicator {
                width: 26px;
                height: 4px;
            }

            .text-section {
                padding: 20px;
                flex: 1;
                min-height: 0;
            }

            .text-content {
                left: 20px;
                right: 20px;
                padding: 25px;
                border-radius: 14px;
            }

            .text-content::before {
                border-radius: 14px;
            }

            .album-title {
                font-size: 1.8rem;
            }
            
            .album-artist {
                letter-spacing: 3px;
                margin-bottom: 15px;
                font-size: 0.85rem;
            }
            
            .album-desc {
                margin-bottom: 20px;
                font-size: 0.9rem;
                line-height: 1.6;
            }

            .album-meta {
                font-size: 0.75rem;
                gap: 15px;
            }

            /* Уменьшаем свечения на мобилках для производительности */
            .bg-glow {
                width: 600px;
                height: 600px;
                filter: blur(80px);
            }

            .aurora {
                filter: blur(70px);
                opacity: 0.4;
            }

            .aurora-1, .aurora-2 { width: 380px; height: 380px; }
            .aurora-3, .aurora-4 { width: 340px; height: 340px; }
        }

        @media (max-width: 600px) {
            .app-container {
                width: 100%;
                height: 100dvh;
                border-radius: 0;
                border-left: none;
                border-right: none;
            }

            .covers-section {
                padding: 15px 15px 10px;
            }

            .cover-wrapper {
                max-width: 160px;
            }

            .indicators {
                margin-top: 15px;
            }

            .text-section {
                padding: 12px;
            }

            .text-content {
                left: 12px;
                right: 12px;
                padding: 20px;
                border-radius: 12px;
            }

            .text-content::before {
                border-radius: 12px;
            }

            .album-title {
                font-size: 1.5rem;
                letter-spacing: 1px;
                margin-bottom: 6px;
            }

            .album-artist {
                font-size: 0.75rem;
                letter-spacing: 2px;
                margin-bottom: 12px;
            }

            .album-desc {
                font-size: 0.85rem;
                line-height: 1.55;
                margin-bottom: 15px;
                padding-left: 12px;
                border-left-width: 2px;
            }

            .album-meta {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 12px;
                padding-top: 12px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 380px) {
            .cover-wrapper {
                max-width: 130px;
            }

            .text-content {
                padding: 16px;
            }

            .album-title {
                font-size: 1.25rem;
            }

            .album-desc {
                font-size: 0.78rem;
                margin-bottom: 12px;
            }

            .album-meta {
                font-size: 0.65rem;
                gap: 8px;
            }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .app-container {
                flex-direction: row;
                height: 95dvh;
                width: 96%;
                border-radius: 14px;
            }

            .covers-section {
                border-right: 1px solid var(--glass-border);
                border-bottom: none;
                padding: 15px;
            }

            .cover-wrapper {
                max-width: 150px;
            }

            .indicators {
                margin-top: 12px;
            }

            .text-section {
                padding: 15px;
            }

            .text-content {
                left: 15px;
                right: 15px;
                padding: 18px;
            }

            .album-title {
                font-size: 1.3rem;
            }

            .album-desc {
                font-size: 0.8rem;
                line-height: 1.5;
                margin-bottom: 12px;
            }

            .album-meta {
                padding-top: 10px;
                font-size: 0.7rem;
            }
        }

        @media (hover: hover) and (pointer: fine) {
            .indicator:hover {
                background: rgba(255, 255, 255, 0.3);
                transform: scaleY(1.5);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Fallback для браузеров без color-mix */
        @supports not (background: color-mix(in srgb, red 50%, transparent)) {
            .text-content {
                background: var(--accent-color);
            }
        }
    </style>
</head>
<body>

    <!-- Световой слой (фоновое освещение) -->
    <div class="light-layer">
        <div class="stars"></div>
        <div class="aurora aurora-1"></div>
        <div class="aurora aurora-2"></div>
        <div class="aurora aurora-3"></div>
        <div class="aurora aurora-4"></div>
        <div class="bg-glow" id="bgGlow"></div>
    </div>

    <!-- Основной контейнер -->
    <div class="app-container" id="appContainer">
        
        <!-- Левая секция: Обложки -->
        <div class="covers-section">
            <div class="cover-wrapper" id="coverWrapper">
                <!-- Изображения будут добавлены через JS -->
            </div>
            <div class="indicators" id="indicators">
                <!-- Индикаторы будут добавлены через JS -->
            </div>
        </div>

        <!-- Правая секция: Текст -->
        <div class="text-section" id="textSection">
            <!-- Текстовые блоки будут добавлены через JS -->
        </div>
    </div>

    <script>
        // --- Данные альбомов ---
        const albums = [
            {
                id: 1,
                image: "CHASE.png", 
                title: "DON'T TRY THIS",
                artist: "Chase Atlintic",
                desc: "Экспериментальный сборник, исследующий границы жанра. Агрессивный звук, тяжелые басы и атмосфера тревоги. Альбом, который не боится быть неудобным.",
                year: "2019",
                genre: "EXPERIMENTAL, Dark RnB",
                color: "#ff0033",
                bgColor: "#1a0000"
            },
            {
                id: 2,
                image: "ANAK.png",
                title: "БАИКИ ИНСАЙДЕРА",
                artist: "ANACONDAZ",
                desc: "Мрачный и гипнотический взгляд на городскую жизнь. Смесь трэпа, индастриала и пост-панка. Тексты о системе, деньгах и потере себя в мегаполисе.",
                year: "2015",
                genre: "INDUSTRIAL HIP-HOP",
                color: "#3355ff",
                bgColor: "#00001a"
            },
            {
                id: 3,
                image: "100GECS.png",
                title: "1000 gecs",
                artist: "100 gecs",
                desc: "GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC GEC",
                year: "2019",
                genre: "RAP / ELECTRONIC",
                color: "#1a8a4a",
                bgColor: "#001a0a"
            },
            {
                id: 4,
                image: "NOIZE.png",
                title: "Выход в город",
                artist: "Noiзe MC",
                desc: "Резкий и урбанистический звук. История о поиске себя среди бетонных джунглей. Тяжелые риффы, речитатив и атмосфера ночного города.",
                year: "2021",
                genre: "POST-PUNK / RAP / RAP-ROCK",
                color: "#00bfff",
                bgColor: "#001a33"
            }
        ];

        // --- Переменные DOM ---
        const coverWrapper = document.getElementById('coverWrapper');
        const indicatorsContainer = document.getElementById('indicators');
        const textSection = document.getElementById('textSection');
        const bgGlow = document.getElementById('bgGlow');
        const appContainer = document.getElementById('appContainer');
        
        let currentIndex = 0;
        let isAnimating = false;

        // --- Инициализация ---
        function init() {
            albums.forEach((album, index) => {
                const img = document.createElement('img');
                img.src = album.image;
                img.alt = album.title;
                img.dataset.index = index;
                img.loading = 'lazy';
                img.decoding = 'async';
                if (index === 0) img.classList.add('active');
                coverWrapper.appendChild(img);

                const indicator = document.createElement('div');
                indicator.classList.add('indicator');
                if (index === 0) indicator.classList.add('active');
                indicator.dataset.index = index;
                indicator.addEventListener('click', () => goToAlbum(index));
                indicator.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    goToAlbum(index);
                }, { passive: false });
                indicatorsContainer.appendChild(indicator);

                const textDiv = document.createElement('div');
                textDiv.classList.add('text-content');
                if (index === 0) textDiv.classList.add('active');
                // Устанавливаем цвет для color-mix в CSS
                textDiv.style.setProperty('--card-color', album.color);
                
                textDiv.innerHTML = `
                    <h2 class="album-title">${album.title}</h2>
                    <div class="album-artist">${album.artist}</div>
                    <p class="album-desc">${album.desc}</p>
                    <div class="album-meta">
                        <span>${album.year}</span>
                        <span>${album.genre}</span>
                    </div>
                `;
                textSection.appendChild(textDiv);
            });

            updateTheme(0);
            initParallax();
            initSwipe();
        }

        // --- Смена альбома ---
        function goToAlbum(index) {
            if (isAnimating || index === currentIndex) return;
            isAnimating = true;

            const prevIndex = currentIndex;
            currentIndex = index;

            const images = coverWrapper.querySelectorAll('img');
            images[prevIndex].classList.remove('active');
            images[currentIndex].classList.add('active');

            const indicators = indicatorsContainer.querySelectorAll('.indicator');
            indicators[prevIndex].classList.remove('active');
            indicators[currentIndex].classList.add('active');

            const texts = textSection.querySelectorAll('.text-content');
            texts[prevIndex].classList.remove('active');
            
            setTimeout(() => {
                texts[currentIndex].classList.add('active');
                const title = texts[currentIndex].querySelector('.album-title');
                title.classList.remove('active');
                void title.offsetWidth;
                title.classList.add('active');
            }, 100);

            updateTheme(currentIndex);

            setTimeout(() => {
                isAnimating = false;
            }, 600);
        }

        // --- Обновление темы ---
        function updateTheme(index) {
            const album = albums[index];
            
            document.documentElement.style.setProperty('--accent-color', album.color);
            document.documentElement.style.setProperty('--bg-color', album.bgColor);
            
            // Обновляем meta theme-color для мобильных браузеров
            const themeMeta = document.querySelector('meta[name="theme-color"]');
            if (themeMeta) themeMeta.setAttribute('content', album.bgColor);
            
            // Основное свечение
            bgGlow.style.background = `radial-gradient(circle, ${album.color} 0%, transparent 65%)`;
            
            // Тень контейнера с цветом альбома
            appContainer.style.boxShadow = `
                0 25px 60px -10px rgba(0, 0, 0, 0.7),
                0 0 80px ${album.color}22,
                inset 0 1px 0 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 0 rgba(0, 0, 0, 0.2),
                inset 0 0 80px rgba(255, 255, 255, 0.02)
            `;
        }

        // --- Эффект параллакса (только для мыши) ---
        function initParallax() {
            const isTouchDevice = window.matchMedia('(hover: none)').matches;
            if (isTouchDevice) return;

            appContainer.addEventListener('mousemove', (e) => {
                if (window.innerWidth < 900) return;
                
                const rect = appContainer.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                
                const rotateX = ((y - centerY) / centerY) * -5;
                const rotateY = ((x - centerX) / centerX) * 5;
                
                coverWrapper.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
            });

            appContainer.addEventListener('mouseleave', () => {
                coverWrapper.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
            });
        }

        // --- Свайпы для мобильных ---
        function initSwipe() {
            let touchStartX = 0;
            let touchStartY = 0;
            let touchStartTime = 0;
            const SWIPE_THRESHOLD = 50;
            const TIME_THRESHOLD = 600;
            const ANGLE_THRESHOLD = 30;

            appContainer.addEventListener('touchstart', (e) => {
                const touch = e.changedTouches[0];
                touchStartX = touch.screenX;
                touchStartY = touch.screenY;
                touchStartTime = Date.now();
            }, { passive: true });

            appContainer.addEventListener('touchend', (e) => {
                const touch = e.changedTouches[0];
                const deltaX = touch.screenX - touchStartX;
                const deltaY = touch.screenY - touchStartY;
                const deltaTime = Date.now() - touchStartTime;

                if (deltaTime > TIME_THRESHOLD) return;
                if (Math.abs(deltaX) < SWIPE_THRESHOLD) return;
                
                const angle = Math.abs(Math.atan2(deltaY, deltaX) * 180 / Math.PI);
                if (angle > ANGLE_THRESHOLD && angle < (180 - ANGLE_THRESHOLD)) return;

                if (deltaX < 0) {
                    const nextIndex = (currentIndex + 1) % albums.length;
                    goToAlbum(nextIndex);
                } else {
                    const prevIndex = (currentIndex - 1 + albums.length) % albums.length;
                    goToAlbum(prevIndex);
                }
            }, { passive: true });
        }

        // --- Обработка смены ориентации ---
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                coverWrapper.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
            }, 200);
        });

        // --- Запуск ---
        init();
    </script>
</body>
